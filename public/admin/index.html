<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesignLab Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container" style="padding:50px 0;max-width:850px"><div class="brand">Design<span>Lab</span> Admin</div><h1>Content Management</h1><p style="color:var(--muted)">Owner/collaborator admin surface. Add lessons, tools, resources and tutorials without editing the frontend.</p><div class="card"><label>Content type</label><select id="type" style="width:100%;padding:12px;margin:8px 0 15px"><option value="lesson">Lesson</option><option value="tool">Tool</option><option value="resource">Resource</option><option value="tutorial">YouTube Tutorial</option></select><textarea id="data" style="width:100%;height:260px;padding:14px;border:1px solid var(--line);border-radius:12px" placeholder='{"title":"New lesson","level":"Beginner","category":"Fundamentals","duration":"20 min","lesson_order":31}'></textarea><button class="primary" style="margin-top:12px" onclick="save()">Add Content</button><p id="msg"></p></div></main><script>async function save(){const msg=document.querySelector('#msg');try{const data=JSON.parse(document.querySelector('#data').value);const r=await fetch('/api/admin-content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:document.querySelector('#type').value,data})});if(!r.ok)throw Error(await r.text());msg.textContent='Content added successfully.'}catch(e){msg.textContent='Could not add content: '+e.message}}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — DesignLab</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center}.login{width:min(420px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow)}.login h1{font-size:34px;letter-spacing:-.05em;margin:8px 0}.login p{color:var(--muted);line-height:1.5}.login input,.login button,.google{width:100%;height:48px;border-radius:12px}.login input{border:1px solid var(--line);padding:0 14px;margin:10px 0}.login button{border:0;background:#171717;color:#fff;font-weight:800;margin-top:8px}.google{display:flex;align-items:center;justify-content:center;background:#fff;color:#171717;border:1px solid var(--line);text-decoration:none;font-weight:800;margin:18px 0 10px}.alt{background:#fff!important;color:#171717!important;border:1px solid var(--line)!important}.msg{min-height:20px;font-size:14px}</style></head><body><main class="login"><div class="brand">Design<span>Lab</span></div><h1 id="title">Sign in</h1><p id="sub">We'll email you a one-time code. No password needed.</p><a class="google" id="google" href="#">Continue with Google</a><form id="form"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden><button id="submit">Continue</button><button id="back" class="alt" type="button" hidden>Use a different email</button></form><div id="offer" hidden><button id="add">Add a passkey</button><button id="skip" class="alt">Not now</button></div><p class="msg" id="msg"></p><p style="text-align:center;font-size:13px;color:#98a2b3;margin:14px 0 0">New to DesignLab? <a href="/signup.html" style="color:#9db0ff;text-decoration:none">Create an account</a></p></main><script>(function(){const A=hatchable.auth,form=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg'),google=document.querySelector('#google'),offer=document.querySelector('#offer'),add=document.querySelector('#add'),skip=document.querySelector('#skip'),title=document.querySelector('#title'),sub=document.querySelector('#sub');let step='email',has=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};const done=()=>location.replace(next());const say=t=>msg.textContent=t||'';const declined=()=>localStorage.getItem('passkey_offer_declined')==='1';const decline=()=>localStorage.setItem('passkey_offer_declined','1');A.getSession().then(s=>s?.user&&done());google.href='/api/auth/google/start?next='+encodeURIComponent(next());form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});has=!!r?.has_passkey;if(has&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:email.value.trim()});if(d?.user)return done()}catch{}}step='code';code.hidden=false;email.style.display='none';back.hidden=false;submit.textContent='Sign in';sub.textContent='Enter the code we sent to '+email.value.trim()+'.';say('Code sent.');code.focus()}else{const d=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!d?.user)throw Error('Invalid code');if(has||declined()||!A.supportsPasskeys()){return done()}form.hidden=true;google.hidden=true;title.textContent="You're signed in";sub.textContent='Add a passkey for faster sign-in next time.';offer.hidden=false}}catch(err){say(err?.status===429?'Too many attempts. Try again shortly.':err?.message||'Something went wrong.')}finally{submit.disabled=false}};back.onclick=()=>{step='email';code.hidden=true;email.style.display='block';back.hidden=true;submit.textContent='Continue';sub.textContent="We'll email you a one-time code. No password needed.";say('')};add.onclick=async()=>{add.disabled=true;skip.disabled=true;try{const r=await A.registerPasskey();if(!r)decline();done()}catch(e){say(e?.message||'Could not save passkey.')}finally{add.disabled=false;skip.disabled=false}};skip.onclick=()=>{decline();done()};email.focus()})()</script></body></html>
